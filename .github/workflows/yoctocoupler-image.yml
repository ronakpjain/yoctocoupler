name: Build Yoctocoupler CM5 image

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/yoctocoupler-image.yml"
      - "kas/**"
      - "meta-yoctocoupler/**"
  pull_request:
    paths:
      - ".github/workflows/yoctocoupler-image.yml"
      - "kas/**"
      - "meta-yoctocoupler/**"

permissions:
  contents: read

jobs:
  build:
    name: Build Raspberry Pi CM5 PREEMPT_RT image
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Check out sources
        uses: actions/checkout@v4

      - name: Reclaim runner disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
          df -h

      - name: Restore Yocto caches
        uses: actions/cache@v4
        with:
          path: |
            build/downloads
            build/sstate-cache
          key: yocto-${{ runner.os }}-${{ hashFiles('kas/**', 'meta-yoctocoupler/**') }}
          restore-keys: |
            yocto-${{ runner.os }}-

      # The checksum keeps the downloaded build wrapper tied to the reviewed release.
      - name: Download pinned KAS container wrapper
        env:
          KAS_WRAPPER_URL: https://raw.githubusercontent.com/siemens/kas/59e55e4f4e38d659e04de0018c9e5671a2a2fedb/kas-container
          KAS_WRAPPER_SHA256: 5309424870c8d445800d4d98d064b0f4e3f0126557179ccce686ad4afb6c97e2
        run: |
          curl --fail --location --silent --show-error \
            "${KAS_WRAPPER_URL}" --output "${RUNNER_TEMP}/kas-container"
          echo "${KAS_WRAPPER_SHA256}  ${RUNNER_TEMP}/kas-container" | sha256sum --check
          chmod 0755 "${RUNNER_TEMP}/kas-container"

      - name: Preflight kernel append and metadata with KAS
        env:
          KAS_IMAGE_VERSION: "4.7"
          KAS_BUILD_DIR: ${{ github.workspace }}/build
        run: |
          "${RUNNER_TEMP}/kas-container" shell kas/yoctocoupler-cm5.yml -c '
            set -eu

            appends=$(bitbake-layers show-appends)
            printf "%s\\n" "$appends"
            if ! printf "%s\\n" "$appends" | grep -Fq "linux-raspberrypi_6.12.bbappend"; then
              echo "Expected linux-raspberrypi_6.12.bbappend was not found by bitbake-layers show-appends" >&2
              exit 1
            fi

            metadata=$(mktemp)
            image_metadata=$(mktemp)
            trap "rm -f $metadata $image_metadata" EXIT
            bitbake -e virtual/kernel > "$metadata"
            if ! grep -Eq "^LINUX_VERSION=\"6[.]12[.]" "$metadata"; then
              echo "Expected linux-raspberrypi 6.12, but another kernel version is selected" >&2
              exit 1
            fi
            if ! grep "^SRC_URI=" "$metadata" | grep -Fq "file://yoctocoupler-rt.cfg"; then
              echo "Effective virtual/kernel SRC_URI lacks yoctocoupler-rt.cfg" >&2
              exit 1
            fi
            if ! grep -Eq "^LINUX_VERSION_EXTENSION=\".*-yoctocoupler-rt.*\"$" "$metadata"; then
              echo "Effective virtual/kernel LINUX_VERSION_EXTENSION lacks -yoctocoupler-rt" >&2
              exit 1
            fi
            if grep "^SRC_URI=" "$metadata" | grep -Fq "yoctocoupler-qemu-igb.cfg"; then
              echo "Hardware kernel unexpectedly includes the QEMU-only igb fragment" >&2
              exit 1
            fi

            bitbake -e yoctocoupler-image > "$image_metadata"
            if grep "^IMAGE_INSTALL=" "$image_metadata" | grep -Fq "kernel-module-igb"; then
              echo "Hardware image unexpectedly includes kernel-module-igb" >&2
              exit 1
            fi
          '

      - name: Build image with KAS
        env:
          KAS_IMAGE_VERSION: "4.7"
          KAS_BUILD_DIR: ${{ github.workspace }}/build
        run: |
          "${RUNNER_TEMP}/kas-container" build kas/yoctocoupler-cm5.yml

      - name: Show generated image files
        run: |
          find build/tmp/deploy/images/raspberrypi5 \
            -maxdepth 1 -type f -name 'yoctocoupler-image-*.wic*' -print

      - name: Upload CM5 image
        uses: actions/upload-artifact@v4
        with:
          name: yoctocoupler-cm5-preempt-rt
          if-no-files-found: error
          path: |
            build/tmp/deploy/images/raspberrypi5/yoctocoupler-image-*.wic.bz2
            build/tmp/deploy/images/raspberrypi5/yoctocoupler-image-*.wic.bmap

      - name: Preflight QEMU-only IGB configuration with KAS
        env:
          KAS_IMAGE_VERSION: "4.7"
          KAS_BUILD_DIR: ${{ github.workspace }}/build
        run: |
          "${RUNNER_TEMP}/kas-container" shell kas/yoctocoupler-cm5-qemu.yml -c '
            set -eu

            kernel_metadata=$(mktemp)
            image_metadata=$(mktemp)
            trap "rm -f $kernel_metadata $image_metadata" EXIT
            bitbake -e virtual/kernel > "$kernel_metadata"
            if ! grep "^SRC_URI=" "$kernel_metadata" | grep -Fq "yoctocoupler-qemu-igb.cfg"; then
              echo "QEMU kernel metadata lacks the igb config fragment" >&2
              exit 1
            fi
            if ! grep "^KERNEL_MODULE_AUTOLOAD=" "$kernel_metadata" | grep -Fq "igb"; then
              echo "QEMU kernel metadata does not autoload igb" >&2
              exit 1
            fi

            bitbake -e yoctocoupler-image > "$image_metadata"
            if ! grep "^IMAGE_INSTALL=" "$image_metadata" | grep -Fq "kernel-module-igb"; then
              echo "QEMU image metadata does not install kernel-module-igb" >&2
              exit 1
            fi
          '

      - name: Remove hardware image outputs before QEMU build
        run: |
          find build/tmp/deploy/images/raspberrypi5 -maxdepth 1 -type f \
            \( -name 'yoctocoupler-image-*.wic*' -o -name Image \) -delete

      - name: Build QEMU-only image with KAS
        env:
          KAS_IMAGE_VERSION: "4.7"
          KAS_BUILD_DIR: ${{ github.workspace }}/build
        run: |
          "${RUNNER_TEMP}/kas-container" build kas/yoctocoupler-cm5-qemu.yml

      - name: Stage QEMU image and matching kernel
        run: |
          deploy=build/tmp/deploy/images/raspberrypi5
          test -s "$deploy/Image"
          mkdir -p qemu-image-artifacts
          cp -L "$deploy/Image" qemu-image-artifacts/Image
          cp "$deploy"/yoctocoupler-image-*.wic.bz2 qemu-image-artifacts/
          cp "$deploy"/yoctocoupler-image-*.wic.bmap qemu-image-artifacts/
          find qemu-image-artifacts -maxdepth 1 -type f -print

      - name: Upload QEMU-only image and matching kernel
        uses: actions/upload-artifact@v4
        with:
          name: yoctocoupler-cm5-qemu-preempt-rt
          if-no-files-found: error
          path: qemu-image-artifacts/*
