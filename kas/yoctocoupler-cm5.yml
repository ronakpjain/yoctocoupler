header:
  version: 14

machine: raspberrypi-cm5-io-board
distro: poky
target:
  - yoctocoupler-image

repos:
  poky:
    url: https://git.yoctoproject.org/poky.git
    branch: scarthgap
    commit: b2c16f1e69130558574e1363aff944647fa9cd11
    layers:
      meta:
      meta-poky:

  meta-raspberrypi:
    url: https://github.com/agherzan/meta-raspberrypi.git
    branch: scarthgap
    commit: 6ca1f75017cc5d5acdb8bb05634c4bc01fa049fd

  yoctocoupler:
    layers:
      meta-yoctocoupler:

env:
  # KAS forwards this only when a caller supplies a public key.
  YOCTOCOUPLER_SSH_PUBLIC_KEY: null

local_conf_header:
  yoctocoupler: |
    INIT_MANAGER = "systemd"
    PACKAGECONFIG:append:pn-systemd = " networkd"
    BB_NUMBER_THREADS ?= "8"
    PARALLEL_MAKE ?= "-j 8"
